[mcp_servers.warehouse-ast-graph]
command = "node"
args = [
  "--no-warnings",
  "-e",
  "const fs=require('fs'),path=require('path'),os=require('os');const c=[path.resolve('tools/ast-sidecar/dist/mcp.js'),path.resolve('plugins/ast-graph-traceability/dist/mcp.js'),path.join(os.homedir(),'.gemini/config/plugins/ast-graph-traceability/dist/mcp.js')].find(p=>fs.existsSync(p));if(c){process.argv[1]=c;import('file://'+c);}"
]
